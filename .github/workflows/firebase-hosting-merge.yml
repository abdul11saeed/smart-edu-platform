name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EDUAIPLATFORM_39FE9 }}
          channelId: live
          projectId: eduaiplatform-39fe9
      - run: npm install -g firebase-tools
      - run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_EDUAIPLATFORM_39FE9 }}" > service-account.json
          firebase deploy --only functions --project eduaiplatform-39fe9
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service-account.json
